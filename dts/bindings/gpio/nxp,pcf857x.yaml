description: NXP PCF857x I2C-based GPIO expander (PCF8574 / PCF8575)

compatible: "nxp,pcf857x"

include: [i2c-device.yaml, gpio-controller.yaml]

properties:
  ngpios:
    type: int
    required: true
    enum:
      - 8
      - 16
    description: Number of GPIOs provided by the expander

  int-gpios:
    type: phandle-array
    description: |
      GPIO connected to the controller INT pin. This pin is active-low.

  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
